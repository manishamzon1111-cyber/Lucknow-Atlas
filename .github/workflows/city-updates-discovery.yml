name: City updates discovery

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: city-updates-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/city-updates-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/city-updates-requirements.txt

      - name: Discover updates
        run: |
          python scripts/discover-city-updates.py

      - name: Read result
        id: result
        shell: bash
        run: |
          set -euo pipefail
          cat .city-updates/result.env >> "$GITHUB_OUTPUT"

      - name: Create or update review issue
        if: steps.result.outputs.create_issue == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          DATE="$(date -u +%Y-%m-%d)"
          TITLE="City updates review — ${DATE}"

          EXISTING="$(
            gh issue list \
              --state open \
              --search "\"${TITLE}\" in:title" \
              --json number,title \
              --jq '.[] | select(.title == "'"${TITLE}"'") | .number' \
              | head -n 1
          )"

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --body-file .city-updates/review.md
          else
            gh issue create \
              --title "$TITLE" \
              --body-file .city-updates/review.md
          fi

      - name: Save discovery state
        if: steps.result.outputs.candidate_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          cp .city-updates/seen-next.json seen_urls.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_urls.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update city discovery state"
          git push
