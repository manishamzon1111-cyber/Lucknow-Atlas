name: Add approved suggestion to map

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  add-place:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Process suggestion and open PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'sites.json';
            const issue = context.payload.issue;
            const body = issue.body || '';

            const fail = async (msg) => {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `⚠️ Couldn't auto-add this suggestion: ${msg}\n\nPlease edit this issue with the missing/corrected info, then re-add the \`approved\` label to retry.`,
              });
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'approved',
              }).catch(() => {});
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-info'],
              });
            };

            // ---- Parse fields from the issue body ----
            const field = (label) => {
              const re = new RegExp(`\\*\\*${label}:\\*\\*\\s*(.+)`, 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };

            const name = field('Name');
            const category = field('Category');
            const location = field('Location / Maps link');

            const whyMatch = body.match(/## Why it should be included\s*\n+([\s\S]*?)\n+##/);
            const summary = whyMatch ? whyMatch[1].trim() : '';

            const sourceMatch = body.match(/## Source \/ photo\s*\n+([\s\S]*?)\n+---/);
            const source = sourceMatch ? sourceMatch[1].trim() : '';

            if (!name || !location) {
              await fail('missing required Name or Location field in the issue body (was this issue created by the suggestion form?).');
              return;
            }

            // ---- Try to extract coordinates ----
            let lat = null, lng = null;

            const patterns = [
              /@(-?\d+\.\d+),(-?\d+\.\d+)/,                 // .../@26.85,80.91,17z
              /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,              // Maps place URL internal format
              /[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/,             // ?q=26.85,80.91
              /^\s*(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)\s*$/, // plain "lat, lng"
            ];

            for (const re of patterns) {
              const m = location.match(re);
              if (m) {
                lat = parseFloat(m[1]);
                lng = parseFloat(m[2]);
                break;
              }
            }

            const inIndiaBounds = (lat, lng) =>
              lat >= 6 && lat <= 37 && lng >= 68 && lng <= 97;

            if (lat === null || lng === null || !inIndiaBounds(lat, lng)) {
              await fail(
                `could not confidently extract coordinates from the Location field ("${location}"). ` +
                `Please edit the issue with a Google Maps link (containing @lat,lng) or plain "lat, lng" coordinates.`
              );
              return;
            }

            // ---- Load and validate existing data ----
            let sites;
            try {
              sites = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (!Array.isArray(sites)) throw new Error('sites.json root is not an array');
            } catch (e) {
              await fail(`sites.json is not valid — refusing to touch it. (${e.message})`);
              return;
            }

            // ---- Build a unique slug id ----
            const slugify = (s) =>
              s.toLowerCase()
               .trim()
               .replace(/[^a-z0-9]+/g, '-')
               .replace(/(^-|-$)/g, '');

            let id = slugify(name);
            let suffix = 2;
            const existingIds = new Set(sites.map(s => s.id));
            while (existingIds.has(id)) {
              id = `${slugify(name)}-${suffix++}`;
            }

            // ---- Duplicate-name warning (non-blocking) ----
            const nameDupe = sites.find(
              s => s.name.trim().toLowerCase() === name.trim().toLowerCase()
            );

            // ---- New entry, matching existing schema exactly ----
            const newEntry = {
              id,
              name,
              period: "",
              year: "",
              lat,
              lng,
              wiki: "",
              summary: summary || "No description provided.",
              commonsQuery: name,
              images: [],
              category: category && category !== 'Not sure' ? category : 'Other',
              cover: "",
              mapsQuery: location,
              coordVerified: "unverified",
              coordSource: `GitHub issue #${issue.number}`,
            };

            sites.push(newEntry);

            // ---- Validate the result parses back cleanly before writing anything ----
            const output = JSON.stringify(sites, null, 2) + '\n';
            try {
              JSON.parse(output);
            } catch (e) {
              await fail(`internal error building sites.json (${e.message}). No changes made.`);
              return;
            }

            // ---- Create branch, commit, open PR ----
            const branch = `suggestion/${id}`;
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: 'heads/main',
            });

            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: baseRef.data.object.sha,
            }).catch(async (e) => {
              if (!String(e.message).includes('Reference already exists')) throw e;
            });

            const currentFile = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo,
              path, ref: branch,
            });

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path,
              message: `Add "${name}" from suggestion #${issue.number}`,
              content: Buffer.from(output).toString('base64'),
              sha: currentFile.data.sha,
              branch,
            });

            const warningNote = nameDupe
              ? `\n\n⚠️ **Note:** an existing entry with the same name (\`${nameDupe.id}\`) already exists — please check for duplicates before merging.`
              : '';

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Add place: ${name}`,
              head: branch,
              base: 'main',
              body:
                `Auto-generated from suggestion #${issue.number}.\n\n` +
                `**Still needs before merging:**\n` +
                `- [ ] Add real photos to \`img/${id}/\` and update \`images\`/\`cover\`\n` +
                `- [ ] Verify coordinates (currently marked \`unverified\`)\n` +
                `- [ ] Fill in \`period\`, \`year\`, \`wiki\` if known\n` +
                `- [ ] Double check category: \`${newEntry.category}\`` +
                warningNote,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ Opened PR #${pr.data.number} with this suggestion: ${pr.data.html_url}`,
            });

            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, name: 'approved',
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, labels: ['pr-opened'],
            });
